# Install once per clone:  uv run pre-commit install
# Hook repositories are pinned to commit SHAs (the trailing comment names the tag).
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0f4b65a503cc866b9b5e62dda2020f7943b01a65  # frozen: 0.12.22
    hooks:
      - id: uv-lock
        args: [--check]

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (architecture contracts)
        entry: uv run --no-sync lint-imports
        language: system
        types: [python]
        pass_filenames: false
