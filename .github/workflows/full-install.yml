# Installs the WHOLE lock (torch included; the CUDA stack on Linux) and checks that the heavy
# import chain resolves without any model weights. Not part of the required check: it is several
# GB on Linux, so it runs weekly, on demand, and when the dependency set changes.
name: Full install

on:
  schedule:
    - cron: "53 4 * * 1" # Mondays
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/full-install.yml

permissions:
  contents: read

concurrency:
  group: full-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.22"
  UV_NO_SYNC: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONUTF8: "1"

jobs:
  full:
    name: full lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked
      - name: torch and laya's heavy modules import on CPU (no weights are loaded)
        run: >-
          uv run python -c "import torch, laya; from laya import Agent;
          print('torch', torch.__version__, 'cuda', torch.cuda.is_available());
          print('laya', laya.__version__, Agent.__name__)"
      - name: Default suite on the full environment
        run: uv run pytest
