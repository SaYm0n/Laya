# Weekly check for new upstream laya releases. It reports (job summary + one tracking issue) and
# never changes the pin: upgrades go through the checklist in docs/DEVELOPMENT.md.
name: Upstream watch

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.22"
  UV_NO_SYNC: "1"

jobs:
  watch:
    name: compare the pin with PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
      issues: write # open one tracking issue when a newer release exists; nothing else is written
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Install the script's only dependency (packaging) from locked hashes
        run: uv sync --locked --only-group dev
      - id: check
        name: Check PyPI
        run: |
          uv run python scripts/check_upstream.py --report "$RUNNER_TEMP/upstream.md"
          cat "$RUNNER_TEMP/upstream.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open a tracking issue (no code is changed)
        if: steps.check.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label upstream \
            --json title --jq '.[].title')"
          if printf '%s\n' "$open" | grep -Fxq "$TITLE"; then
            echo "Already tracked: $TITLE"
            exit 0
          fi
          gh label create upstream --repo "$GITHUB_REPOSITORY" --color 5319E7 \
            --description "Upstream laya release tracking" --force
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --body-file "$RUNNER_TEMP/upstream.md" --label upstream
